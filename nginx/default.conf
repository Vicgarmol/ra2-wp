# Define el bloque del servidor
server {
    # Nginx escucha en el puerto 80 interno
    listen 80;
    # Acepta cualquier nombre de servidor
    server_name _;
    # Directorio raíz donde están los archivos de WordPress
    root /var/www/html;
    # Archivo índice por defecto
    index index.php;
    # Permite subir archivos de hasta 64MB
    client_max_body_size 64M;
    
    # Maneja las peticiones a la ruta principal
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    
    # Procesa los archivos PHP enviándolos a WordPress
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
